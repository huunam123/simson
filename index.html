<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculus Practice Quiz</title>
<style>
:root{--t:#172033;--m:#68748a;--p:#315efb;--gb:#dcfce7;--rb:#fee2e2;--bd:#dbe3ef}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eef3ff,#f7f9fc 260px,#f4f7fb);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t)}
main{max-width:1000px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#203a9a,#315efb);color:#fff;padding:26px;border-radius:22px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,40px)}.hero p{margin:6px 0;line-height:1.55}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--bd);background:#fff;padding:11px 16px;border-radius:12px;font-weight:800;cursor:pointer}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px;text-align:center}.n{font-size:24px;font-weight:800;color:var(--p)}.l{font-size:13px;color:var(--m)}
.progress{height:9px;background:#e6ebf3;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:var(--p)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}.actions button{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid var(--bd)!important}
.section{margin:28px 0 12px;font-size:22px}.q{background:#fff;border:1px solid var(--bd);border-radius:17px;padding:18px;margin:12px 0}.qhead{display:flex;gap:10px}.num{width:32px;height:32px;border-radius:9px;background:#eef2ff;color:var(--p);display:grid;place-items:center;font-weight:800;flex:none}.qt{font-weight:650;line-height:1.6}
.opts{display:grid;gap:9px;margin-top:13px}.opt{width:100%;text-align:left;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer;line-height:1.5}.opt:hover:not(:disabled){background:#f8faff;border-color:#9bb0ff}.opt:disabled{cursor:default;opacity:1}.opt.correct{background:var(--gb);border-color:#4ade80;color:#14532d}.opt.wrong{background:var(--rb);border-color:#f87171;color:#7f1d1d}
.exp{display:none;margin-top:12px;padding:12px 13px;border-radius:11px;line-height:1.6}.exp.show{display:block}.good{background:var(--gb);color:#14532d}.bad{background:var(--rb);color:#7f1d1d}
.result{display:none;background:#fff;border:1px solid var(--bd);border-radius:17px;padding:18px;margin-top:24px}.result.show{display:block}
.topic-note{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:14px 0;color:var(--m);line-height:1.6}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','style','pre','code']}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body><main>
<section class="hero">
<h1>Calculus Multiple-Choice Practice</h1>
<p>Practice Simpson's Rule and Improper Integrals in English.</p>
<p>Each topic contains 20 questions: 5 theory, 5 easy, 5 medium, and 5 hard.</p>
</section>

<div class="tabs">
<button class="tab active" onclick="switchTopic('simpson',this)">Simpson's Rule</button>
<button class="tab" onclick="switchTopic('improper',this)">Improper Integrals</button>
</div>

<div id="topicNote" class="topic-note"></div>

<section class="stats">
<div class="stat"><div id="answered" class="n">0</div><div class="l">Answered</div></div>
<div class="stat"><div id="correct" class="n">0</div><div class="l">Correct</div></div>
<div class="stat"><div id="wrong" class="n">0</div><div class="l">Wrong</div></div>
<div class="stat"><div id="score" class="n">0/20</div><div class="l">Score</div></div>
</section>

<div class="progress"><div id="bar" class="bar"></div></div>
<div class="actions"><button class="primary" onclick="showResult()">View Result</button><button class="secondary" onclick="resetTopic()">Restart This Topic</button></div>
<div id="quiz"></div>
<section id="result" class="result"><h2>Quiz Result</h2><p id="resultText"></p></section>
</main>

<script>
const quizzes={
simpson:{
note:"Focus: Simpson's 1/3 Rule, composite form, weights, step size, accuracy, and numerical integration.",
sections:[
["Theory",[
["What is Simpson's 1/3 Rule mainly used to approximate?",["\\(\\int_a^b f(x)\\,dx\\)","\\(f'(x)\\)","\\(\\lim_{x\\to a}f(x)\\)","\\(\\sum f(k)\\)"],0,"Simpson's Rule is a numerical integration method used to approximate a definite integral."],
["For the basic Simpson's 1/3 Rule using three equally spaced points, what are the weights?",["\\(1,2,1\\)","\\(1,4,1\\)","\\(1,3,1\\)","\\(2,4,2\\)"],1,"The formula is \\(\\frac{h}{3}[f(x_0)+4f(x_1)+f(x_2)]\\), so the weights are 1, 4, and 1."],
["For the Composite Simpson's 1/3 Rule, the number of subintervals \\(n\\) must be:",["Odd","Prime","Even","Divisible by 3"],2,"Composite Simpson's 1/3 Rule works with pairs of subintervals, so \\(n\\) must be even."],
["If \\([a,b]\\) is divided into \\(n\\) equal subintervals, the step size \\(h\\) is:",["\\(\\frac{a+b}{n}\\)","\\(\\frac{b-a}{n}\\)","\\(\\frac{n}{b-a}\\)","\\((b-a)n\\)"],1,"The total interval length is \\(b-a\\). Dividing it into \\(n\\) equal parts gives \\(h=(b-a)/n\\)."],
["Simpson's 1/3 Rule is exact for every polynomial of degree at most:",["1","2","3","4"],2,"Simpson's 1/3 Rule is exact for polynomials up to degree 3. Its error term depends on the fourth derivative."]
]],
["Easy Exercises",[
["Use Simpson's Rule with \\(n=2\\) to evaluate \\(\\int_0^2 x^2dx\\).",["\\(4/3\\)","\\(2\\)","\\(8/3\\)","\\(4\\)"],2,"Here \\(h=1\\), so \\(\\frac13[0+4(1)+4]=\\frac83\\)."],
["Given \\(a=0,b=4,n=4\\), what is the step size \\(h\\)?",["0.5","1","2","4"],1,"\\(h=(4-0)/4=1\\)."],
["For \\(n=4\\), which Simpson weight pattern is correct?",["1,2,4,2,1","1,4,2,4,1","1,4,4,4,1","1,2,2,2,1"],1,"The endpoints have weight 1, odd interior indices have weight 4, and even interior indices have weight 2."],
["Use Simpson's Rule with \\(n=2\\) for \\(\\int_0^2(x+1)dx\\).",["2","3","4","5"],2,"\\(\\frac13[1+4(2)+3]=4\\)."],
["If \\(f(x)=1\\) on \\([0,6]\\), Simpson's Rule gives:",["1","3","6","12"],2,"The integral of the constant function 1 over \\([0,6]\\) equals the interval length, which is 6. Simpson's Rule is exact here."]
]],
["Medium Exercises",[
["Use Composite Simpson's Rule with \\(n=4\\) for \\(\\int_0^4x^3dx\\).",["48","56","64","72"],2,"\\(\\frac13[0+4(1)+2(8)+4(27)+64]=64\\)."],
["For \\(n=6\\), which function values receive weight 4?",["\\(f_1,f_3,f_5\\)","\\(f_2,f_4\\)","\\(f_0,f_2,f_4,f_6\\)","All interior points"],0,"The odd interior indices 1, 3, and 5 receive weight 4."],
["Given \\(f(0)=1,f(1)=2,f(2)=5,f(3)=10,f(4)=17\\) and \\(h=1\\), Simpson's Rule gives:",["\\(76/3\\)","\\(88/3\\)","\\(92/3\\)","32"],0,"\\(\\frac13[1+4(2)+2(5)+4(10)+17]=\\frac{76}{3}\\)."],
["Use Simpson's Rule with \\(n=2\\) for \\(\\int_0^2e^xdx\\). Which expression is correct?",["\\(\\frac13[1+4e+e^2]\\)","\\(\\frac23[1+4e+e^2]\\)","\\(\\frac12[1+2e+e^2]\\)","\\(1+4e+e^2\\)"],0,"Here \\(h=1\\), so the weighted sum is multiplied by \\(h/3=1/3\\)."],
["If \\(n=8\\), how many interior points receive weight 4?",["2","3","4","5"],2,"The odd interior indices are 1, 3, 5, and 7, so there are 4 such points."]
]],
["Hard Exercises",[
["For \\(n=4,h=0.5\\), which expression correctly applies Simpson's Rule to \\(\\int_0^2\\frac{1}{1+x^2}dx\\)?",["\\(\\frac{0.5}{3}[1+4\\frac1{1.25}+2\\frac12+4\\frac1{3.25}+\\frac15]\\)","\\(\\frac{0.5}{2}[1+2\\frac1{1.25}+2\\frac12+2\\frac1{3.25}+\\frac15]\\)","\\(\\frac13[1+4\\frac1{1.25}+4\\frac12+4\\frac1{3.25}+\\frac15]\\)","\\(0.5[1+\\frac1{1.25}+\\frac12+\\frac1{3.25}+\\frac15]\\)"],0,"The nodes are 0, 0.5, 1, 1.5, and 2. The Simpson weights are 1, 4, 2, 4, 1, and the outside factor is \\(h/3\\)."],
["What is the global error order of the Composite Simpson's 1/3 Rule?",["\\(O(h)\\)","\\(O(h^2)\\)","\\(O(h^3)\\)","\\(O(h^4)\\)"],3,"For a sufficiently smooth function, the global error of Composite Simpson's Rule is fourth order."],
["If the step size is reduced from \\(h\\) to \\(h/2\\), the Simpson error is approximately reduced by:",["2 times","4 times","8 times","16 times"],3,"Because the error is proportional to \\(h^4\\), replacing \\(h\\) by \\(h/2\\) multiplies the error by \\((1/2)^4=1/16\\)."],
["Use Composite Simpson's Rule with \\(n=4\\) to evaluate \\(\\int_{-2}^{2}x^3dx\\).",["-8","0","8","16"],1,"\\(x^3\\) is an odd function over the symmetric interval \\([-2,2]\\), so the integral is 0. Simpson's Rule is also exact for cubic polynomials."],
["Given \\(h=1\\), \\(f_0=2,f_1=3,f_2=5,f_3=7,f_4=11\\), Simpson's Rule gives:",["19","20","21","22"],2,"\\(\\frac13[2+4(3)+2(5)+4(7)+11]=\\frac{63}{3}=21\\)."]
]]
]},
improper:{
note:"Focus: improper integrals with infinite limits, vertical singularities, convergence/divergence, p-tests, and limit definitions.",
sections:[
["Theory",[
["Which situation makes a definite integral improper?",["Only when the integrand is a polynomial","When an interval is infinite or the integrand becomes unbounded","Only when both limits are negative","Whenever the integrand contains a fraction"],1,"An improper integral occurs when at least one integration limit is infinite or when the integrand becomes unbounded at a point in or at the boundary of the interval."],
["The integral \\(\\int_1^{\\infty} f(x)\\,dx\\) is defined using:",["A derivative","A finite sum","A limit as the upper bound tends to infinity","Simpson's Rule only"],2,"It is defined as \\(\\lim_{b\\to\\infty}\\int_1^b f(x)\\,dx\\), provided the limit exists and is finite."],
["For \\(p>0\\), the p-integral \\(\\int_1^{\\infty}\\frac{1}{x^p}dx\\) converges when:",["\\(p<1\\)","\\(p=1\\)","\\(p>1\\)","All \\(p>0\\)"],2,"The standard p-test says \\(\\int_1^{\\infty}x^{-p}dx\\) converges exactly when \\(p>1\\)."],
["The integral \\(\\int_0^1\\frac{1}{x^p}dx\\) converges when:",["\\(p<1\\)","\\(p=1\\)","\\(p>1\\)","Never"],0,"Near zero, \\(x^{-p}\\) is integrable on \\((0,1]\\) exactly when \\(p<1\\)."],
["If an improper integral has a vertical singularity at an interior point \\(c\\), what must be done?",["Ignore the point","Split the integral at \\(c\\) and test both sides","Replace \\(c\\) by zero","Use only the left-hand side"],1,"The integral must be split into two improper integrals, one approaching \\(c\\) from the left and one from the right. Both must converge."]
]],
["Easy Exercises",[
["Evaluate \\(\\int_1^{\\infty}\\frac{1}{x^2}dx\\).",["0","1","2","Diverges"],1,"\\(\\int_1^b x^{-2}dx=[-1/x]_1^b=1-1/b\\). Taking \\(b\\to\\infty\\) gives 1."],
["Does \\(\\int_1^{\\infty}\\frac{1}{x}dx\\) converge?",["Yes, to 0","Yes, to 1","Yes, to \\(\\ln 2\\)","No, it diverges"],3,"\\(\\int_1^b\\frac1x dx=\\ln b\\), and \\(\\ln b\\to\\infty\\). Therefore the integral diverges."],
["Evaluate \\(\\int_0^1\\frac{1}{\\sqrt{x}}dx\\).",["1","2","\\(\\infty\\)","Diverges"],1,"Write the integral as \\(\\lim_{a\\to0^+}\\int_a^1x^{-1/2}dx\\). This gives \\(2-2\\sqrt a\\to2\\)."],
["Does \\(\\int_0^1\\frac{1}{x^2}dx\\) converge?",["Yes, to 1","Yes, to 2","No, it diverges","Yes, to 0"],2,"\\(\\int_a^1x^{-2}dx=-1+1/a\\), which tends to infinity as \\(a\\to0^+\\)."],
["Evaluate \\(\\int_0^{\\infty}e^{-x}dx\\).",["0","1","e","Diverges"],1,"\\(\\int_0^be^{-x}dx=1-e^{-b}\\), and \\(e^{-b}\\to0\\), so the value is 1."]
]],
["Medium Exercises",[
["Determine \\(\\int_2^{\\infty}\\frac{1}{x^3}dx\\).",["\\(1/4\\)","\\(1/8\\)","\\(1/2\\)","Diverges"],1,"\\(\\int_2^b x^{-3}dx=[-1/(2x^2)]_2^b=1/8-1/(2b^2)\\to1/8\\)."],
["Evaluate \\(\\int_0^1\\ln x\\,dx\\).",["\\(-1\\)","0","1","Diverges"],0,"Using integration by parts, \\(\\int_a^1\\ln x\\,dx=[x\\ln x-x]_a^1\\). As \\(a\\to0^+\\), \\(a\\ln a\\to0\\), so the value is \\(-1\\)."],
["Does \\(\\int_1^{\\infty}\\frac{1}{\\sqrt{x}}dx\\) converge?",["Yes, to 1","Yes, to 2","No, it diverges","Yes, to \\(1/2\\)"],2,"This is a p-integral with \\(p=1/2\\le1\\), so it diverges."],
["Evaluate \\(\\int_{-\\infty}^{0}e^x dx\\).",["0","1","e","Diverges"],1,"\\(\\int_a^0e^x dx=1-e^a\\). As \\(a\\to-\\infty\\), \\(e^a\\to0\\), giving 1."],
["For what values of \\(p\\) does \\(\\int_1^{\\infty}x^{-p}dx\\) converge?",["\\(p<0\\)","\\(0<p<1\\)","\\(p>1\\)","\\(p\\ge0\\)"],2,"The p-test for an infinite interval gives convergence exactly for \\(p>1\\)."]
]],
["Hard Exercises",[
["Evaluate \\(\\int_0^{\\infty}\\frac{1}{1+x^2}dx\\).",["\\(1\\)","\\(\\pi/4\\)","\\(\\pi/2\\)","Diverges"],2,"An antiderivative is \\(\\arctan x\\). Thus the value is \\(\\lim_{b\\to\\infty}(\\arctan b-0)=\\pi/2\\)."],
["Does \\(\\int_{-1}^{1}\\frac{1}{x}dx\\) converge as an improper integral?",["Yes, to 0","Yes, to 2","No, it diverges","Yes, to \\(\\ln 2\\)"],2,"Although a symmetric principal value would be 0, the improper integral requires the left and right integrals to converge separately. They do not, so it diverges."],
["Evaluate \\(\\int_0^1\\frac{1}{\\sqrt{1-x}}dx\\).",["1","2","\\(\\pi/2\\)","Diverges"],1,"Let \\(u=1-x\\). The integral becomes \\(\\int_0^1u^{-1/2}du=2\\), so it converges to 2."],
["Determine whether \\(\\int_1^{\\infty}\\frac{1}{x^2+x}dx\\) converges and find its value.",["Diverges","Converges to \\(1\\)","Converges to \\(\\ln 2\\)","Converges to \\(1/2\\)"],2,"Use partial fractions: \\(1/(x^2+x)=1/x-1/(x+1)\\). The limit gives \\(\\ln 2\\)."],
["Evaluate \\(\\int_0^{\\infty}x e^{-x}dx\\).",["0","1","2","Diverges"],1,"Integration by parts gives \\(\\int_0^bxe^{-x}dx=[-xe^{-x}-e^{-x}]_0^b\\). As \\(b\\to\\infty\\), both exponential terms vanish, leaving 1."]
]]
]}
};

let topic="simpson", answeredCount=0, correctCount=0, locked=new Set();

function switchTopic(name,btn){
 topic=name;
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 resetTopic(false);
 render();
}

function resetTopic(doRender=true){
 answeredCount=0; correctCount=0; locked=new Set();
 document.getElementById("result").classList.remove("show");
 if(doRender) render();
 updateStats();
}

function render(){
 const qz=quizzes[topic];
 document.getElementById("topicNote").textContent=qz.note;
 const quiz=document.getElementById("quiz");
 quiz.innerHTML="";
 let k=0;
 for(const [title,qs] of qz.sections){
  const h=document.createElement("h2"); h.className="section"; h.textContent=title+" — 5 questions"; quiz.appendChild(h);
  for(const q of qs){
   k++; const id=topic+"-"+k; const card=document.createElement("article"); card.className="q";
   card.innerHTML='<div class="qhead"><div class="num">'+k+'</div><div class="qt">'+q[0]+'</div></div><div class="opts">'+q[1].map((x,i)=>'<button class="opt" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+x+'</button>').join("")+'</div><div class="exp"></div>';
   card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(card,q,+b.dataset.i,id));
   quiz.appendChild(card);
  }
 }
 document.getElementById("result").classList.remove("show");
 if(window.MathJax?.typesetPromise) MathJax.typesetPromise([quiz]);
}

function pick(card,q,i,id){
 if(locked.has(id))return;
 locked.add(id); answeredCount++;
 const bs=[...card.querySelectorAll(".opt")], ok=i===q[2];
 bs.forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add("correct")});
 const e=card.querySelector(".exp");
 if(ok){
  correctCount++; e.className="exp show good";
  e.innerHTML="<b>✓ Correct.</b> "+q[3];
 }else{
  bs[i].classList.remove("correct"); bs[i].classList.add("wrong");
  e.className="exp show bad";
  e.innerHTML="<b>✗ Incorrect.</b><br><b>Why is your choice wrong?</b> This option does not satisfy the required definition, convergence test, or calculation.<br><b>Why is the correct answer right?</b> "+q[3];
 }
 updateStats();
 if(window.MathJax?.typesetPromise) MathJax.typesetPromise([card]);
}

function updateStats(){
 answered.textContent=answeredCount;
 correct.textContent=correctCount;
 wrong.textContent=answeredCount-correctCount;
 score.textContent=correctCount+"/20";
 bar.style.width=(answeredCount*5)+"%";
}

function showResult(){
 result.classList.add("show");
 resultText.textContent="You answered "+answeredCount+"/20 questions and got "+correctCount+" correct ("+Math.round(correctCount/20*100)+"%).";
 result.scrollIntoView({behavior:"smooth"});
}

render(); updateStats();
</script>
</body></html>
