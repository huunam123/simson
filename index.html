<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trắc nghiệm Quy tắc Simpson</title>
<style>
:root{--b:#f5f7fb;--c:#fff;--t:#172033;--m:#68748a;--p:#315efb;--g:#15803d;--gb:#dcfce7;--r:#b91c1c;--rb:#fee2e2;--bd:#dbe3ef}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eef3ff,#f7f9fc 260px,#f4f7fb);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t)}
main{max-width:980px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#203a9a,#315efb);color:#fff;padding:26px;border-radius:22px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,40px)}.hero p{margin:6px 0;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px;text-align:center}.n{font-size:24px;font-weight:800;color:var(--p)}.l{font-size:13px;color:var(--m)}
.progress{height:9px;background:#e6ebf3;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:var(--p)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}.actions button{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid var(--bd)!important}
.section{margin:28px 0 12px;font-size:22px}.q{background:#fff;border:1px solid var(--bd);border-radius:17px;padding:18px;margin:12px 0}.qhead{display:flex;gap:10px}.num{width:32px;height:32px;border-radius:9px;background:#eef2ff;color:var(--p);display:grid;place-items:center;font-weight:800;flex:none}.qt{font-weight:650;line-height:1.6}
.opts{display:grid;gap:9px;margin-top:13px}.opt{width:100%;text-align:left;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer;line-height:1.5}.opt:hover:not(:disabled){background:#f8faff;border-color:#9bb0ff}.opt:disabled{cursor:default;opacity:1}.opt.correct{background:var(--gb);border-color:#4ade80;color:#14532d}.opt.wrong{background:var(--rb);border-color:#f87171;color:#7f1d1d}
.exp{display:none;margin-top:12px;padding:12px 13px;border-radius:11px;line-height:1.6}.exp.show{display:block}.good{background:var(--gb);color:#14532d}.bad{background:var(--rb);color:#7f1d1d}
.result{display:none;background:#fff;border:1px solid var(--bd);border-radius:17px;padding:18px;margin-top:24px}.result.show{display:block}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','style','pre','code']}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body><main>
<section class="hero"><h1>Đề thi trắc nghiệm: Quy tắc Simpson</h1><p>20 câu • 5 lý thuyết • 5 dễ • 5 trung bình • 5 khó.</p><p>Chọn đáp án để chấm ngay. Đúng hiện xanh; sai hiện đỏ, đồng thời hiện đáp án đúng và giải thích.</p></section>
<section class="stats"><div class="stat"><div id="answered" class="n">0</div><div class="l">Đã trả lời</div></div><div class="stat"><div id="correct" class="n">0</div><div class="l">Đúng</div></div><div class="stat"><div id="wrong" class="n">0</div><div class="l">Sai</div></div><div class="stat"><div id="score" class="n">0/20</div><div class="l">Điểm</div></div></section>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="actions"><button class="primary" onclick="showResult()">Xem kết quả</button><button class="secondary" onclick="location.reload()">Làm lại</button></div>
<div id="quiz"></div>
<section id="result" class="result"><h2>Kết quả</h2><p id="resultText"></p></section>
</main>
<script>
const data=[
["Lý thuyết",[
["Quy tắc Simpson 1/3 dùng để xấp xỉ đại lượng nào?",["\\(\\int_a^b f(x)\\,dx\\)","\\(f'(x)\\)","\\(\\lim_{x\\to a}f(x)\\)","\\(\\sum f(k)\\)"],0,"Simpson là phương pháp tích phân số dùng để xấp xỉ tích phân xác định."],
["Trong Simpson 1/3 cơ bản với ba điểm cách đều, bộ trọng số là:",["\\(1,2,1\\)","\\(1,4,1\\)","\\(1,3,1\\)","\\(2,4,2\\)"],1,"Công thức là \\(\\frac{h}{3}[f(x_0)+4f(x_1)+f(x_2)]\\), nên trọng số là 1,4,1."],
["Với Simpson 1/3 ghép, số khoảng chia \\(n\\) phải:",["Lẻ","Nguyên tố","Chẵn","Chia hết cho 3"],2,"Simpson 1/3 ghép xử lý các khoảng theo từng cặp nên \\(n\\) phải chẵn."],
["Nếu chia \\([a,b]\\) thành \\(n\\) khoảng đều nhau, \\(h\\) bằng:",["\\(\\frac{a+b}{n}\\)","\\(\\frac{b-a}{n}\\)","\\(\\frac{n}{b-a}\\)","\\((b-a)n\\)"],1,"Độ dài đoạn là \\(b-a\\), chia đều thành \\(n\\) khoảng nên \\(h=(b-a)/n\\)."],
["Simpson 1/3 chính xác với mọi đa thức có bậc không vượt quá:",["1","2","3","4"],2,"Simpson 1/3 chính xác với đa thức đến bậc 3; sai số liên quan đạo hàm bậc 4."]
]],
["Bài tập dễ",[
["Dùng Simpson với \\(n=2\\) tính \\(\\int_0^2 x^2dx\\).",["\\(4/3\\)","\\(2\\)","\\(8/3\\)","\\(4\\)"],2,"Với \\(h=1\\): \\(\\frac13[0+4(1)+4]=\\frac83\\)."],
["Cho \\(a=0,b=4,n=4\\). Bước lưới \\(h\\) là:",["0.5","1","2","4"],1,"\\(h=(4-0)/4=1\\)."],
["Với \\(n=4\\), mẫu trọng số Simpson đúng là:",["1,2,4,2,1","1,4,2,4,1","1,4,4,4,1","1,2,2,2,1"],1,"Hai đầu mút hệ số 1; chỉ số lẻ hệ số 4; chỉ số chẵn bên trong hệ số 2."],
["Dùng Simpson với \\(n=2\\) cho \\(\\int_0^2(x+1)dx\\).",["2","3","4","5"],2,"\\(\\frac13[1+4(2)+3]=4\\)."],
["Nếu \\(f(x)=1\\) trên \\([0,6]\\), Simpson cho kết quả:",["1","3","6","12"],2,"Tích phân hàm hằng bằng độ dài đoạn, tức 6; Simpson cũng cho đúng chính xác."]
]],
["Bài tập trung bình",[
["Dùng Simpson ghép \\(n=4\\) cho \\(\\int_0^4x^3dx\\).",["48","56","64","72"],2,"\\(\\frac13[0+4(1)+2(8)+4(27)+64]=64\\)."],
["Với \\(n=6\\), các giá trị nhận hệ số 4 là:",["\\(f_1,f_3,f_5\\)","\\(f_2,f_4\\)","\\(f_0,f_2,f_4,f_6\\)","Tất cả điểm trong"],0,"Các chỉ số lẻ bên trong 1,3,5 nhận hệ số 4."],
["Cho \\(f(0)=1,f(1)=2,f(2)=5,f(3)=10,f(4)=17\\), \\(h=1\\). Simpson cho:",["\\(76/3\\)","\\(88/3\\)","\\(92/3\\)","32"],0,"\\(\\frac13[1+4(2)+2(5)+4(10)+17]=\\frac{76}{3}\\)."],
["Dùng Simpson \\(n=2\\) cho \\(\\int_0^2e^xdx\\). Công thức đúng:",["\\(\\frac13[1+4e+e^2]\\)","\\(\\frac23[1+4e+e^2]\\)","\\(\\frac12[1+2e+e^2]\\)","\\(1+4e+e^2\\)"],0,"Ở đây \\(h=1\\), nên nhân tổng trọng số với \\(h/3=1/3\\)."],
["Nếu \\(n=8\\), có bao nhiêu điểm bên trong nhận hệ số 4?",["2","3","4","5"],2,"Các chỉ số lẻ là 1,3,5,7, tổng cộng 4 điểm."]
]],
["Bài tập khó",[
["Với \\(n=4,h=0.5\\), biểu thức Simpson cho \\(\\int_0^2\\frac{1}{1+x^2}dx\\) là:",["\\(\\frac{0.5}{3}[1+4\\frac1{1.25}+2\\frac12+4\\frac1{3.25}+\\frac15]\\)","\\(\\frac{0.5}{2}[1+2\\frac1{1.25}+2\\frac12+2\\frac1{3.25}+\\frac15]\\)","\\(\\frac13[1+4\\frac1{1.25}+4\\frac12+4\\frac1{3.25}+\\frac15]\\)","\\(0.5[1+\\frac1{1.25}+\\frac12+\\frac1{3.25}+\\frac15]\\)"],0,"Các nút là 0,0.5,1,1.5,2; trọng số 1,4,2,4,1 và hệ số ngoài là \\(h/3\\)."],
["Sai số toàn cục của Simpson 1/3 ghép có bậc:",["\\(O(h)\\)","\\(O(h^2)\\)","\\(O(h^3)\\)","\\(O(h^4)\\)"],3,"Với hàm đủ trơn, sai số toàn cục của Simpson ghép là bậc bốn."],
["Giảm \\(h\\) xuống \\(h/2\\) thì sai số Simpson gần đúng giảm:",["2 lần","4 lần","8 lần","16 lần"],3,"Vì sai số tỉ lệ với \\(h^4\\), nên \\((1/2)^4=1/16\\)."],
["Dùng Simpson ghép \\(n=4\\) tính \\(\\int_{-2}^{2}x^3dx\\).",["-8","0","8","16"],1,"\\(x^3\\) là hàm lẻ trên đoạn đối xứng nên tích phân bằng 0; Simpson cũng chính xác với đa thức bậc 3."],
["Cho \\(h=1\\), \\(f_0=2,f_1=3,f_2=5,f_3=7,f_4=11\\). Simpson cho:",["19","20","21","22"],2,"\\(\\frac13[2+4(3)+2(5)+4(7)+11]=\\frac{63}{3}=21\\)."]
]]
];
let a=0,c=0,locked=new Set(),k=0;
const quiz=document.getElementById("quiz");
for(const [title,qs] of data){
 const h=document.createElement("h2");h.className="section";h.textContent=title+" — 5 câu";quiz.appendChild(h);
 for(const q of qs){k++;const id="q"+k;const card=document.createElement("article");card.className="q";card.innerHTML='<div class="qhead"><div class="num">'+k+'</div><div class="qt">'+q[0]+'</div></div><div class="opts">'+q[1].map((x,i)=>'<button class="opt" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+x+'</button>').join("")+'</div><div class="exp"></div>';card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(card,q,+b.dataset.i,id));quiz.appendChild(card)}
}
function pick(card,q,i,id){if(locked.has(id))return;locked.add(id);a++;const bs=[...card.querySelectorAll(".opt")],ok=i===q[2];bs.forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add("correct")});const e=card.querySelector(".exp");if(ok){c++;e.className="exp show good";e.innerHTML="<b>✓ Chính xác.</b> "+q[3]}else{bs[i].classList.remove("correct");bs[i].classList.add("wrong");e.className="exp show bad";e.innerHTML="<b>✗ Chưa đúng.</b><br><b>Vì sao sai?</b> Lựa chọn này không thỏa quy tắc/công thức cần dùng.<br><b>Vì sao đáp án đúng?</b> "+q[3]}stats();MathJax.typesetPromise([card])}
function stats(){answered.textContent=a;correct.textContent=c;wrong.textContent=a-c;score.textContent=c+"/20";bar.style.width=a*5+"%"}
function showResult(){result.classList.add("show");resultText.textContent="Bạn đã làm "+a+"/20 câu và đúng "+c+" câu ("+Math.round(c/20*100)+"%).";result.scrollIntoView({behavior:"smooth"})}
MathJax.typesetPromise([quiz]);
</script></body></html>
